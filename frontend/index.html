<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Expense Tracker 🎀</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">🎀 My Pink Expense Tracker ✨</span>
      <button id="exportBtn" class="btn btn-sm btn-light fw-bold rounded-pill px-3">📥 Export CSV</button>
    </div>
  </nav>

  <div class="container">
    <!-- Alert Banner Container -->
    <div id="alertContainer"></div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card bg-pastel-pink shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Total Amount 💕</h5>
            <h3 class="card-text fw-bold" id="totalAmount">$0.00</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-pastel-purple shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Total Expenses 🌸</h5>
            <h3 class="card-text fw-bold" id="totalCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-pastel-peach shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Highest Expense 🛍️</h5>
            <h3 class="card-text fw-bold" id="highestExpense">$0.00</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Expense Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0">✨ Add New Expense</h5>
      </div>
      <div class="card-body">
        <form id="addExpenseForm" class="row g-3">
          <div class="col-md-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required placeholder="e.g. Makeup, Coffee ☕">
          </div>
          <div class="col-md-3">
            <label for="amount" class="form-label">Amount ($)</label>
            <input type="number" step="0.01" class="form-control" id="amount" required placeholder="0.00" min="0.01">
          </div>
          <div class="col-md-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="" selected disabled>Select category</option>
              <option value="Food">Food 🍕</option>
              <option value="Transport">Transport 🚗</option>
              <option value="Bills">Bills 📄</option>
              <option value="Entertainment">Entertainment 🎬</option>
              <option value="Other">Other ✨</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" required>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary" id="addBtn">Add Expense 💖</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Table Section with Search, Filter & Sort -->
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <h5 class="mb-0">📋 Expense List</h5>
          </div>
          <div class="col-md-8">
            <div class="d-flex flex-wrap gap-2 justify-content-md-end">
              <!-- Search Bar -->
              <input type="text" id="searchInput" class="form-control form-control-sm" style="width: 160px;" placeholder="🔍 Search title...">
              
              <!-- Category Filter -->
              <select id="filterCategory" class="form-select form-select-sm" style="width: auto;">
                <option value="All">All Categories 🌈</option>
                <option value="Food">Food 🍕</option>
                <option value="Transport">Transport 🚗</option>
                <option value="Bills">Bills 📄</option>
                <option value="Entertainment">Entertainment 🎬</option>
                <option value="Other">Other ✨</option>
              </select>

              <!-- Sort Option -->
              <select id="sortBy" class="form-select form-select-sm" style="width: auto;">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="amount-desc">Amount: High to Low</option>
                <option value="amount-asc">Amount: Low to High</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="card-body position-relative">
        <!-- Spinner Loader -->
        <div id="loadingSpinner" class="text-center py-4 d-none">
          <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Loading your cute expenses... ✨</p>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Expense Modal -->
  <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editExpenseModalLabel">✏️ Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editExpenseForm">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" required>
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount ($)</label>
              <input type="number" step="0.01" class="form-control" id="editAmount" required min="0.01">
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="Food">Food 🍕</option>
                <option value="Transport">Transport 🚗</option>
                <option value="Bills">Bills 📄</option>
                <option value="Entertainment">Entertainment 🎬</option>
                <option value="Other">Other ✨</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveEditBtn">Save Changes ✨</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
